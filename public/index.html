<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spritpreise in meiner Nähe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Spritpreise</h1>

            <p>
                Finde die günstigsten Tankstellen in deiner Nähe!
            </p>
        </header>


        <section class="controls">

            <label for="fuelType">
                Spritart
            </label>

            <select id="fuelType">
                <option value="benzina">Super E5</option>
                <option value="e10">Super E10</option>
                <option value="motorina">Diesel</option>
            </select>

            <label for="locationSearch">
                Standort (optional)
            </label>

            <input type="text" id="locationSearch" placeholder="z.B. Berlin oder 10115">

            <!--<button id="searchLocation">
                Ort Suchen
            </button> -->


            <label for="radius">
                Suchradius
            </label>

            <select id="radius">
                <option value="5">5 km</option>
                <option value="10" selected>10 km</option>
                <option value="15">15 km</option>
                <option value="25">25 km</option>
            </select>

            <label for="sortType">
                Sortieren nach
            </label>

            <select id="sortType">
                <option value="priceAsc">Preis aufsteigend</option>
                <option value="priceDesc">Preis absteigend</option>
                <option value="distance">Entfernung</option>
            </select>

            <button id="loadPrices">
                Suchen
            </button>

        </section>


        <section id="locationInfo"></section>


        <section id="results">

            <div class="start-message">
                Klicke auf
                <strong>„Suchen“</strong>,
                um Tankstellen in deiner Nähe zu finden.
            </div>

        </section>


        <footer>
            Datenquelle:
            PretCarburant.ro /
            Tankerkönig / MTS-K
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
